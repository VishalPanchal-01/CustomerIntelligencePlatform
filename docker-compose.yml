services:

  customer-intelligence-api:

    build:
      context: .
      dockerfile: Dockerfile

    image:
      customer-intelligence-api:latest

    container_name:
      customer-intelligence-api-container

    ports:
      - "${API_PORT:-8000}:8000"

    environment:
      APP_ENV: "${APP_ENV:-production}"
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    restart:
      unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 30s