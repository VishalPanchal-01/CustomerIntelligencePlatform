name: Customer Intelligence CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:


permissions:
  contents: read


concurrency:
  group: customer-intelligence-ci-${{ github.ref }}
  cancel-in-progress: true


env:
  PYTHON_VERSION: "3.12"
  PYTHONPATH: "."


jobs:

  python-tests:

    name: Python Tests

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs pull

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Show Python version
        run: |
          python --version
          pip --version

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip

      - name: Install project dependencies
        run: |
          pip install -r requirements.txt

      - name: Run test suite
        run: |
          python -m pytest -v

      - name: Validate project structure and API
        run: |
          python ci_validate.py


  docker-validation:

    name: Docker Build and API Health

    runs-on: ubuntu-latest

    timeout-minutes: 40

    needs:
      - python-tests

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Pull Git LFS files
        run: |
          git lfs pull

      - name: Show Docker version
        run: |
          docker --version

      - name: Build Docker image
        run: |
          docker build \
            -t customer-intelligence-api:ci \
            .

      - name: Start Docker container
        run: |
          docker run \
            -d \
            --name customer-intelligence-api-ci \
            -p 8000:8000 \
            customer-intelligence-api:ci

      - name: Wait for API health
        shell: bash
        run: |
          echo "Waiting for API..."

          for i in {1..30}
          do

            if curl \
              --fail \
              --silent \
              http://127.0.0.1:8000/health
            then

              echo ""
              echo "API is healthy."
              exit 0

            fi

            echo "Attempt $i: API not ready yet."

            sleep 5

          done

          echo "API failed to become healthy."

          docker logs customer-intelligence-api-ci

          exit 1

      - name: Check Docker container
        run: |
          docker ps

      - name: Validate health endpoint
        run: |
          curl \
            --fail \
            http://127.0.0.1:8000/health

      - name: Validate OpenAPI
        run: |
          curl \
            --fail \
            http://127.0.0.1:8000/openapi.json \
            > openapi.json

      - name: Show container logs
        if: failure()
        run: |
          docker logs customer-intelligence-api-ci

      - name: Cleanup Docker container
        if: always()
        run: |
          docker rm \
            -f \
            customer-intelligence-api-ci \
            || true